name: Deploy Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t tamaravegareyes/front-devops:latest .

      - name: Push Docker image
        run: |
          docker push tamaravegareyes/front-devops:latest

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker rm -f frontend || true
            sudo docker pull tamaravegareyes/front-devops:latest
            sudo docker run -d \
              --name frontend \
              -p 80:80 \
              tamaravegareyes/front-devops:latest
